name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect Project Root
        id: detect-root
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
          elif [ -f "volei/pubspec.yaml" ]; then
            echo "project_dir=volei" >> $GITHUB_OUTPUT
          else
            echo "Error: pubspec.yaml not found" >&2
            exit 1
          fi

      - name: Setup Keystore & Signing (if configured)
        working-directory: ${{ steps.detect-root.outputs.project_dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Configuring release keystore from GitHub Secrets..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload-keystore.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Keystore and android/key.properties created successfully."
          else
            echo "No signing secrets provided. Falling back to default release signing."
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.detect-root.outputs.project_dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.detect-root.outputs.project_dir }}
        run: flutter build apk --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.detect-root.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
